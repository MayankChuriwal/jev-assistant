# ---- the user's own bills on their billers' own sites, paid by the bill page model (a money.goal_for goal); each
# names its start page, as pay_bill would after the user confirmed the site. No note for any of them. The account
# number, codes and captchas go to the user's web chat; every run stops at the approval card (nothing is paid).

[[task]]
id = "bill-bwssb"
category = "bills"
goal = "Pay the BWSSB bill for account [profile:bwssb_account]: the amount due."
url = "https://bwsajala.karnataka.gov.in/bwssb_onlinepg/quickpay.aspx"
skill = "bills-recharges"
end = "gate"
require = ["BWSSB", "₹"]
rule = "The approval card pays a BWSSB water bill, with the amount due that BWSSB's own page showed."
answers = [['\b(captcha|code|otp|rr|account|consumer|number|yours|name)\b', "@user"]]

[[task]]
id = "bill-dishtv"
category = "bills"
goal = "Pay the Dish TV bill for account [profile:dish_tv_account]: exactly ₹300."
url = "https://www.dishtv.in/dth-recharge.html"
skill = "bills-recharges"
end = "gate"
require = ["Dish TV", "300"]
rule = "The approval card pays ₹300 to Dish TV for the user's subscriber account, on Dish TV's own site."
answers = [['\b(captcha|code|otp|subscriber|registered|vc|account|customer|number|yours|name)\b', "@user"]]

[[task]]
