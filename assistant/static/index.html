<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10121A">
<meta name="jev-token" content="{{TOKEN}}">
<title>Rivo AI</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>
<div class="device">
  <div class="screen">
    <div class="statusbar" aria-hidden="true">
      <span id="clock">9:41</span>
      <span class="island"></span>
      <span class="system">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="#fff"><path d="M8 2.6c2.2 0 4.2.9 5.7 2.3l1.1-1.1A9.6 9.6 0 0 0 8 1 9.6 9.6 0 0 0 1.2 3.8l1.1 1.1A8 8 0 0 1 8 2.6Zm0 3.2c1.3 0 2.5.5 3.4 1.3l1.1-1.1A6.4 6.4 0 0 0 8 4.2 6.4 6.4 0 0 0 3.5 6l1.1 1.1A4.8 4.8 0 0 1 8 5.8Zm0 3.2c.5 0 .9.2 1.2.5L8 10.7 6.8 9.5c.3-.3.7-.5 1.2-.5Z"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="23" height="12" rx="3.5" stroke="#fff" stroke-opacity=".4"/><rect x="2" y="2" width="18" height="9" rx="2" fill="#fff"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" fill="#fff" fill-opacity=".5"/></svg>
      </span>
    </div>
    <header>
      <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="#fff"><path d="M20 11v2H8l5.5 5.5-1.42 1.42L4.16 12l7.92-7.92L13.5 5.5 8 11h12Z"/></svg></span>
      <img class="logo" src="/rivo-logo.svg" alt="Rivo">
      <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg></span>
    </header>
    <p id="status" class="status" role="status" hidden>online</p>
    <main id="chat" aria-live="polite">
      <section class="starters" aria-label="Suggestions">
        <img class="rio" src="/rio-mark.png" alt="">
        <h2>Talk Money with Rivo</h2>
        <div class="cards">
          <button type="button" class="starter" data-say="Cancel my subscriptions"><strong>Cancel a subscription</strong><span>Stop an AutoPay you don't use</span></button>
          <button type="button" class="starter" data-say="What AutoPays do I have?"><strong>My AutoPays</strong><span>Every UPI mandate in one list</span></button>
          <button type="button" class="starter" data-say="I want to dispute something on my Experian report"><strong>Fix my credit report</strong><span>Raise an Experian dispute</span></button>
          <button type="button" class="starter" data-say="Buy me a Swiggy voucher"><strong>Buy a voucher</strong><span>Swiggy on SmartBuy or iShop</span></button>
        </div>
      </section>
    </main>
    <form id="composer" class="empty" autocomplete="off">
      <label class="attach" title="Attach a file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg><input type="file" id="file" aria-label="Attach a file" hidden></label>
      <input id="text" aria-label="Message" placeholder="Ask anything or type.…" autocomplete="off">
      <button id="send" type="submit" aria-label="Send"><svg viewBox="0 0 24 24" fill="#fff"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
    </form>
    <p class="disclaimer">Rivo's content is AI generated - Verify before acting.</p>
    <div class="homebar" aria-hidden="true"></div>
  </div>
</div>
<template id="icons">
  <svg data-icon="return" viewBox="0 0 24 24" fill="currentColor"><path d="M19 7v4H5.83l3.58-3.59L8 6l-6 6 6 6 1.41-1.42L5.83 13H21V7h-2Z"/></svg>
  <svg data-icon="copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
  <svg data-icon="up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg>
  <svg data-icon="down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/></svg>
</template>
</body>
</html>
