[project]
name = "jev-assistant"
version = "0.1.0"
description = "A chat assistant that completes real web tasks; Jev chooses every browser step, GPT-4.1 mini plans and writes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["browser-harness==0.1.13", "httpx[http2]>=0.28,<1"]

[project.scripts]
jev = "assistant.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assistant"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not browser'"
markers = ["browser: needs Google Chrome; run with `uv run pytest -m browser`"]
